name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: make ci
      - name: Runs from a plain copy, outside the checkout
        run: |
          cp -r . "$RUNNER_TEMP/copy"
          cd "$RUNNER_TEMP"
          copy/ctx --version
          copy/ctx doctor --store copy/tests/fixtures/store-v1

  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ["python:3.10-slim", "python:3-slim"]
    steps:
      - uses: actions/checkout@v4
      - name: Harness in a container, fixture store on a read-only mount
        run: |
          docker run --rm \
            -v "$PWD:/src:ro" \
            -v "$PWD/tests/fixtures/store-v1:/store:ro" \
            -e CTX_TEST_RO_STORE=/store \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -w /src \
            "${{ matrix.image }}" \
            python -m unittest discover -s tests -t . -v
