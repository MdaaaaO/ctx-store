# Optional: ctx runs from a plain copy (`./ctx`). This file builds the `ctx-store` package on PyPI.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-store"
description = "A markdown context store for coding agents: validated writes, budgeted reads, audit trail."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
dynamic = ["version"]
keywords = ["context", "agents", "markdown", "mcp", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development",
]

[project.urls]
Homepage = "https://github.com/MdaaaaO/ctx-store"
Documentation = "https://github.com/MdaaaaO/ctx-store/blob/main/docs/interface.md"
Changelog = "https://github.com/MdaaaaO/ctx-store/blob/main/CHANGELOG.md"
Issues = "https://github.com/MdaaaaO/ctx-store/issues"

[project.scripts]
ctx = "ctxstore.cli:main"
ctx-serve = "ctxserve.server:main"

[tool.setuptools]
packages = ["ctxstore", "ctxserve"]

[tool.setuptools.package-data]
ctxstore = ["interface.md", "VERSION"]

[tool.setuptools.dynamic]
version = {file = "ctxstore/VERSION"}
